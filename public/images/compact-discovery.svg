<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Compact discovery: full inputs, less context.</title>
  <desc id="description">Full discovery searches for tool names, describes their schemas and PHP guides, then executes. Compact discovery returns the unchanged input schema and a short PHP return shape in search, allowing simple tools to proceed directly to execution. Complex tools still require full describe. The host retains the original schemas and checks authorization, validation and execution limits on every call. Animation indicates request order, not elapsed time.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8f5ff"/></linearGradient>
    <linearGradient id="brand"><stop stop-color="#4c1d95"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 5 3 0 6" fill="none" stroke="#9b8db0"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#191226}
    .muted{fill:#686174}.accent{fill:#4c1d95}.mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
    .tiny{font-size:11px}.small{font-size:13px}.label{font-size:10px;font-weight:700;letter-spacing:1.5px}
    .step{fill:none;stroke:#7f5bff;stroke-width:2;opacity:0;animation:focus 9s infinite;animation-delay:var(--delay,0s)}
    .flow{fill:none;stroke:#7f5bff;stroke-width:2;stroke-dasharray:4 5;animation:travel 2s linear infinite}
    @keyframes focus{0%,8%,40%,100%{opacity:0}13%,32%{opacity:.85}}
    @keyframes travel{to{stroke-dashoffset:-36}}
    @media(prefers-reduced-motion:reduce){.step,.flow{animation:none}.step{opacity:0}}
  </style>
  <rect x=".5" y=".5" width="999" height="759" rx="24" fill="url(#paper)" stroke="#e4dfee"/>
  <g aria-hidden="true">
    <circle cx="43" cy="40" r="7" fill="url(#brand)"/>
    <text x="60" y="45" font-size="15" font-weight="700">Symfony Code Mode</text>
    <text x="960" y="44" text-anchor="end" class="label muted">A SMALLER INTRODUCTION TO YOUR TOOLS</text>
    <text x="500" y="105" text-anchor="middle" font-size="42" font-weight="750" letter-spacing="-1.5">Full inputs. <tspan fill="url(#brand)">Less context.</tspan></text>
    <text x="500" y="138" text-anchor="middle" font-size="16" class="muted">Give the agent enough to call the tool. Keep full validation on the host.</text>

    <rect x="32" y="172" width="448" height="420" rx="16" fill="#fff" stroke="#e4dfee"/>
    <rect x="520" y="172" width="448" height="420" rx="16" fill="#fbf9ff" stroke="#d7c5f7"/>
    <text x="54" y="207" font-size="21" font-weight="700">Full discovery</text>
    <text x="542" y="207" font-size="21" font-weight="700">Compact discovery</text>
    <rect x="867" y="188" width="79" height="24" rx="6" fill="#ede5ff"/>
    <text x="906" y="204" text-anchor="middle" class="label accent" style="letter-spacing:.6px">DEFAULT</text>

    <rect x="54" y="229" width="404" height="64" rx="9" fill="#f7f6fa" stroke="#e4dfee"/>
    <rect class="step" x="54" y="229" width="404" height="64" rx="9"/>
    <text x="72" y="254" class="mono small" font-weight="700">1  tools_search</text>
    <text x="72" y="277" class="small muted">Names + descriptions. Another call for the contract.</text>
    <path d="M256 297v20" stroke="#9b8db0" fill="none" marker-end="url(#arrow)"/>
    <rect x="54" y="325" width="404" height="164" rx="9" fill="#f7f6fa" stroke="#e4dfee"/>
    <rect class="step" style="--delay:2s" x="54" y="325" width="404" height="164" rx="9"/>
    <text x="72" y="351" class="mono small" font-weight="700">2  tools_describe</text>
    <text x="72" y="379" class="small">Full input schema</text>
    <text x="72" y="403" class="small">Full output schema, when declared</text>
    <text x="72" y="427" class="small">PHP example + input and return shapes</text>
    <text x="72" y="451" class="small">Usage notes</text>
    <text x="72" y="474" class="tiny muted">Detailed tool documentation enters the agent context.</text>
    <path d="M256 493v20" stroke="#9b8db0" fill="none" marker-end="url(#arrow)"/>
    <rect x="54" y="521" width="404" height="48" rx="9" fill="#171027"/>
    <rect class="step" style="--delay:4s" x="54" y="521" width="404" height="48" rx="9"/>
    <text x="72" y="550" class="mono small" style="fill:#fff">3  php_execute</text>

    <rect x="542" y="229" width="404" height="216" rx="9" fill="#fff" stroke="#d7c5f7"/>
    <rect class="step" x="542" y="229" width="404" height="216" rx="9"/>
    <text x="560" y="254" class="mono small" font-weight="700">1  tools_search</text>
    <text x="560" y="280" class="small muted">Names + descriptions, plus the calling contract:</text>
    <rect x="560" y="294" width="368" height="40" rx="6" fill="#eee7ff"/>
    <text x="574" y="319" class="small accent" font-weight="650">Original input schema · every constraint kept</text>
    <text x="560" y="361" class="small">Short PHP return shape</text>
    <text x="560" y="384" class="mono tiny accent">stdClass{&quot;id&quot;: int, &quot;title&quot;: string}</text>
    <text x="560" y="410" class="tiny muted">A return shape describes data; it grants no permission.</text>
    <text x="560" y="432" class="mono tiny accent">requiresDescribe: false → ready to call</text>
    <path d="M744 449v64" class="flow" marker-end="url(#arrow)"/>
    <rect x="775" y="459" width="171" height="43" rx="8" fill="#f0e9ff" stroke="#d7c5f7"/>
    <text x="860" y="477" text-anchor="middle" class="tiny accent" font-weight="650">Complex contract?</text>
    <text x="860" y="493" text-anchor="middle" class="mono tiny accent">tools_describe first</text>
    <path d="M775 480h-26" stroke="#9b8db0" stroke-dasharray="3 3"/>
    <rect x="542" y="521" width="404" height="48" rx="9" fill="#4c1d95"/>
    <rect class="step" style="--delay:2s" x="542" y="521" width="404" height="48" rx="9"/>
    <text x="560" y="550" class="mono small" style="fill:#fff">2  php_execute</text>
    <text x="926" y="550" text-anchor="end" class="tiny" style="fill:#e9ddff">One fewer discovery call*</text>

    <path d="M256 592v18h488v-18M500 610v14" stroke="#b7a9ca" fill="none"/>
    <rect x="92" y="628" width="816" height="68" rx="12" fill="#ede5ff" stroke="#d7c5f7"/>
    <text x="500" y="654" text-anchor="middle" class="label accent">SAME HOST CHECKS ON EVERY TOOL CALL</text>
    <text x="500" y="679" text-anchor="middle" font-size="15" class="accent">Authorization · Original schema validation · Execution limits</text>
    <text x="500" y="724" text-anchor="middle" class="tiny muted">*For a simple tool. Complex, referenced or oversized contracts still need describe.</text>
    <text x="500" y="743" text-anchor="middle" class="tiny muted">Illustrates request order, not elapsed time. Shorter discovery does not grant more access.</text>
  </g>
</svg>
