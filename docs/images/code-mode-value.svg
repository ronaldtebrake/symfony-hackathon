    <text x="530" y="414" class="mono" font-size="11" style="fill:#e1eddf">foreach ($articles as $article) {</text>
    <text x="530" y="432" class="mono" font-size="11" style="fill:#e1eddf">  $image = $media[$article-&gt;image_id];</text>
    <text x="530" y="450" class="mono" font-size="11" style="fill:#9ac5a4">  // Keep only the audit findings.</text>
    <text x="530" y="468" class="mono" font-size="11" style="fill:#e1eddf">}</text>
