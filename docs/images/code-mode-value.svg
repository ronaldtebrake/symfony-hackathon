    <text x="849.5" y="314" text-anchor="middle" font-size="9" font-weight="650" letter-spacing=".7" class="green">10 MCP CALLS</text>
    <text x="516" y="343" font-size="13" class="muted">PHP joins and filters the intermediate data.</text>

