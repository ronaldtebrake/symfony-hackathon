    <text x="393.5" y="314" text-anchor="middle" font-size="9" font-weight="650" letter-spacing=".7" class="muted">10 MCP CALLS</text>
    <text x="60" y="343" font-size="13" class="muted">Every batch returns to the agent.</text>
    <text x="516" y="318" font-size="21" font-weight="700" letter-spacing="-.6">With Code Mode</text>
