<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title description">
  <title id="title">Symfony Code Mode: same audit, less data returned to the agent.</title>
  <desc id="description">Animated explanation of a verified reference run. Direct tool calling and Code Mode both check 48 published articles and return the same 10 findings using 10 batched MCP calls. Direct calls return 20,154 bytes of tool-result payload; Code Mode returns 3,014 bytes including discovery, about 85 percent less. PHP processes intermediate data inside gVisor; the host authorizes every tool call. No model was called and no model-token savings are claimed. With reduced motion, the complete comparison stays visible.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfcf8"/><stop offset="1" stop-color="#f4f7f0"/></linearGradient>
    <linearGradient id="smart" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f1f8ec"/></linearGradient>
    <linearGradient id="scan" x2="1"><stop stop-color="#8ce5b0" stop-opacity="0"/><stop offset=".5" stop-color="#8ce5b0" stop-opacity=".18"/><stop offset="1" stop-color="#8ce5b0" stop-opacity="0"/></linearGradient>
    <clipPath id="php-clip"><rect x="516" y="365" width="384" height="113" rx="9"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#1d2b26}
    .muted{fill:#6b756c}.green{fill:#166747}.mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
    .eyebrow{font-size:9px;font-weight:650;letter-spacing:1.7px}.small{font-size:11px}.label{font-size:10px;font-weight:600;letter-spacing:.8px}
    .batch-flash{fill:#cbd9c3;opacity:0;animation:batch 12s ease-in-out infinite;animation-delay:var(--delay)}
    .tool-dot{fill:#91bc8c;opacity:.32;animation:dot 12s ease-in-out infinite;animation-delay:var(--delay)}
    .packet{opacity:0;animation:packet 12s linear infinite;animation-delay:var(--delay)}
    .branch-left{animation:branch-left 12s linear infinite;opacity:0}.branch-right{animation:branch-right 12s linear infinite;opacity:0}
    .scan{animation:scan 12s ease-in-out infinite;opacity:0}.findings-flash{animation:findings 12s ease-in-out infinite;opacity:0}
    .return-packet{animation:return-packet 12s linear infinite;opacity:0}
    .saving-ring{animation:saving 12s ease-in-out infinite;opacity:0}
    @keyframes batch{0%,16%,36%,100%{opacity:0}20%,28%{opacity:.8}}
    @keyframes dot{0%,16%,38%,100%{opacity:.32}20%,31%{opacity:1}}
    @keyframes packet{0%,23%{opacity:0;transform:translate(0,0)}25%{opacity:.8;transform:translate(0,0)}39%{opacity:.8;transform:translate(0,var(--travel))}41%,100%{opacity:0;transform:translate(0,var(--travel))}}
    @keyframes branch-left{0%,4%{opacity:0;transform:translate(480px,250px)}7%{opacity:1;transform:translate(480px,266px)}12%{opacity:1;transform:translate(252px,266px)}15%{opacity:0;transform:translate(252px,284px)}16%,100%{opacity:0}}
    @keyframes branch-right{0%,4%{opacity:0;transform:translate(480px,250px)}7%{opacity:1;transform:translate(480px,266px)}12%{opacity:1;transform:translate(708px,266px)}15%{opacity:0;transform:translate(708px,284px)}16%,100%{opacity:0}}
    @keyframes scan{0%,20%{opacity:0;transform:translateY(0)}24%{opacity:1;transform:translateY(0)}47%{opacity:1;transform:translateY(74px)}50%,100%{opacity:0;transform:translateY(74px)}}
    @keyframes return-packet{0%,50%{opacity:0;transform:translateY(0)}52%{opacity:1;transform:translateY(0)}60%{opacity:1;transform:translateY(23px)}62%,100%{opacity:0;transform:translateY(23px)}}
    @keyframes findings{0%,56%,76%,100%{opacity:0}61%,68%{opacity:.65}}
    @keyframes saving{0%,60%,84%,100%{opacity:0}65%,73%{opacity:.7}}
    @media(prefers-reduced-motion:reduce){.batch-flash,.tool-dot,.packet,.branch-left,.branch-right,.scan,.return-packet,.findings-flash,.saving-ring{animation:none!important}.tool-dot{opacity:1}}
  </style>
  <rect x=".5" y=".5" width="959" height="739" rx="22" fill="url(#paper)" stroke="#dce3d8"/>
  <g aria-hidden="true">
    <rect x="36" y="29" width="28" height="28" rx="8" fill="#1d2b26"/>
    <text x="50" y="49" text-anchor="middle" class="mono" style="fill:#f2f6ed;font-size:16px;font-weight:700">{ }</text>
    <text x="73" y="49" font-size="20" font-weight="750" letter-spacing="-.8">Symfony Code Mode</text>
    <text x="923" y="46" text-anchor="end" class="eyebrow muted">SYMFONY AI × PHP MCP SDK</text>
    <text x="480" y="118" text-anchor="middle" font-size="54" font-weight="750" letter-spacing="-2.3">Same audit. <tspan class="green">Less data.</tspan></text>
    <text x="480" y="151" text-anchor="middle" font-size="17" class="muted">Let PHP do the work between tool calls.</text>

