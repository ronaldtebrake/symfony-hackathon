<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="748" viewBox="0 0 1120 748" role="img" aria-labelledby="title description">
  <title id="title">What Symfony Code Mode adds to MCP</title>
  <desc id="description">A user asks an agent a question. The Symfony AI agent and MCP bridge use the PHP MCP SDK to contact Symfony over HTTP. Pink diamonds mark our additions. Our package exposes a searchable catalog with search_tools and execute_tools. Our separate prototype implements the working group’s draft groups/list and groups/get methods for discovery. A client calls a group member by name with tools/call. On either route, our package checks the budget, arguments and the application’s current permissions for each read. Only allowed calls reach the Symfony AI Toolbox and the app’s PHP handler. The agent receives the result or denial and can answer the user or request another read. Purple squares mark Symfony and PHP MCP SDK components. Grey circles mark the user and app-owned parts.</desc>

  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#f7f5fc"/>
    </linearGradient>
    <marker id="arrow" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#746582" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="ours"><path d="m0 -6 6 6-6 6-6-6z" fill="#ab1769"/></g>
    <g id="upstream"><rect x="-5" y="-5" width="10" height="10" rx="2" fill="#5643a8"/></g>
    <g id="context"><circle r="5" fill="#626673"/></g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #251b30; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -1.3px; }
      .subtitle { font-size: 18px; fill: #554b61; }
      .section { font-size: 21px; font-weight: 700; letter-spacing: -.4px; }
      .name { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
      .body { font-size: 16px; fill: #504659; }
      .key { font-size: 15px; font-weight: 700; }
      .owner { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .mono { font: 15px Menlo, Consolas, monospace; }
      .ours { fill: #911059; }
      .upstream { fill: #49348e; }
      .context { fill: #515562; }
      .connector { fill: none; stroke: #746582; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .base-card { fill: #f1effd; stroke: #b7abe1; }
      .our-card { fill: #fff0f7; stroke: #d084af; }
      .context-card { fill: #f6f6f8; stroke: #c6c5ce; }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="746" rx="24" fill="url(#paper)" stroke="#ddd5e8"/>
  <text x="32" y="55" class="title">What Symfony Code Mode adds to MCP</text>
  <text x="33" y="86" class="subtitle">An agent can find the right tools for a job. Symfony decides whether each read can run.</text>

  <g class="key">
    <use href="#ours" x="40" y="122"/><text x="54" y="127" class="ours">Built in this project</text>
    <use href="#upstream" x="248" y="122"/><text x="262" y="127" class="upstream">Symfony &amp; PHP MCP SDK</text>
    <use href="#context" x="513" y="122"/><text x="527" y="127" class="context">User &amp; application</text>
  </g>
  <path d="M32 149h1056" stroke="#dfd8e7"/>

  <!-- The host sends MCP requests. The model sees the tools the host offers it. -->
  <text x="32" y="186" class="section">In the agent app</text>
  <rect x="32" y="205" width="256" height="71" rx="13" class="context-card"/>
  <use href="#context" x="52" y="228"/><text x="65" y="232" class="owner context">USER PROMPT</text>
  <text x="48" y="259" font-size="20" font-weight="700">“What needs fixing?”</text>
  <path d="M160 276v34" class="connector" marker-end="url(#arrow)"/>

  <rect x="32" y="312" width="256" height="115" rx="13" class="base-card"/>
  <use href="#upstream" x="52" y="335"/><text x="65" y="339" class="owner upstream">SYMFONY AI</text>
  <text x="48" y="367" class="name">Agent &amp; MCP bridge</text>
  <text x="48" y="393" class="body">The model picks a read.</text>
  <text x="48" y="415" class="body">The client sends the call.</text>
  <path d="M288 364h22q8 0 8-8V242q0-8 8-8h46" class="connector" marker-end="url(#arrow)"/>

  <!-- Standard HTTP and protocol handling, followed by the two discovery routes. -->
  <text x="374" y="186" class="section">In the Symfony application</text>
  <rect x="374" y="205" width="714" height="71" rx="13" class="base-card"/>
  <use href="#upstream" x="397" y="228"/>
  <text x="411" y="233" class="key upstream">Symfony Security</text>
  <text x="391" y="257" class="body">Authenticates the caller</text>
  <path d="M591 241h37" class="connector" marker-end="url(#arrow)"/>
  <use href="#upstream" x="654" y="228"/>
  <text x="668" y="233" class="key upstream">Symfony MCP bundle &amp; PHP MCP SDK</text>
  <text x="648" y="257" class="body">Receive and dispatch MCP calls over HTTP</text>

  <g class="connector">
    <path d="M731 276v13m0 0H551v15" marker-end="url(#arrow)"/>
    <path d="M731 289h179v15" marker-end="url(#arrow)"/>
  </g>

  <rect x="374" y="306" width="349" height="157" rx="13" class="our-card"/>
  <use href="#ours" x="397" y="329"/><text x="411" y="333" class="owner ours">OUR PACKAGE</text>
  <text x="391" y="364" class="name">Searchable catalog</text>
  <text x="391" y="390" class="body">MCP lists two tools for the whole catalog.</text>
  <text x="391" y="420" class="mono ours">search_tools</text><text x="525" y="420" class="body">find visible readers</text>
  <text x="391" y="447" class="mono ours">execute_tools</text><text x="525" y="447" class="body">request reads</text>

  <rect x="739" y="306" width="349" height="157" rx="13" class="our-card" stroke-dasharray="6 4"/>
  <use href="#ours" x="762" y="329"/><text x="776" y="333" class="owner ours">OUR PROTOTYPE · MCP GROUPS DRAFT</text>
  <text x="756" y="364" class="name">Named groups</text>
  <text x="756" y="390" class="body">The host opens a group for a known job.</text>
  <text x="756" y="420" class="mono ours">groups/list</text><text x="865" y="420" class="body">→</text><text x="891" y="420" class="mono ours">groups/get</text>
  <text x="756" y="447" class="mono">tools/call</text><text x="865" y="447" class="body">call a member by name</text>

  <path d="M551 463v14h359v-14m-179 14v13" class="connector" marker-end="url(#arrow)"/>
  <rect x="374" y="492" width="714" height="84" rx="13" class="our-card"/>
  <use href="#ours" x="397" y="515"/><text x="411" y="519" class="owner ours">OUR PACKAGE · ON EVERY READ</text>
  <text x="391" y="545" class="name">Check the call against the app’s rules</text>
  <text x="391" y="566" class="body">Check the budget, the arguments and the caller’s current permission.</text>

  <path d="M552 576v36" class="connector" marker-end="url(#arrow)"/>
  <text x="565" y="599" class="key">Allowed</text>
  <rect x="374" y="615" width="329" height="86" rx="13" class="base-card"/>
  <use href="#upstream" x="397" y="638"/><text x="411" y="642" class="owner upstream">SYMFONY AI</text>
  <text x="391" y="676" class="name">Toolbox invokes the tool</text>
  <path d="M703 658h44" class="connector" marker-end="url(#arrow)"/>
  <rect x="750" y="615" width="338" height="86" rx="13" class="context-card"/>
  <use href="#context" x="773" y="638"/><text x="787" y="642" class="owner context">YOUR APPLICATION</text>
  <text x="767" y="676" class="name">PHP handler reads the data</text>

  <!-- Both denial and data return over MCP, then the model can answer or call again. -->
  <path d="M919 701v20H320v-87" class="connector"/>
  <text x="607" y="715" class="key">Result</text>
  <path d="M374 540h-54v94h-30" class="connector" marker-end="url(#arrow)"/>
  <circle cx="320" cy="634" r="3.2" fill="#746582"/>
  <text x="318" y="530" class="key">Denied</text>
  <rect x="32" y="579" width="256" height="122" rx="13" class="context-card"/>
  <use href="#context" x="52" y="604"/><text x="65" y="608" class="owner context">BACK IN THE CONVERSATION</text>
  <text x="48" y="636" font-size="21" font-weight="700">The agent gets a reply</text>
  <text x="48" y="663" class="body">It can answer the user</text>
  <text x="48" y="685" class="body">or ask for another read.</text>
  <path d="M160 579V430" class="connector" stroke-dasharray="4 6" marker-end="url(#arrow)"/>
  <text x="172" y="504" class="body">Another read</text>
</svg>
